name: Journal du Matin

on:
  schedule:
    - cron: '0 6 * * *' # S'exécute tous les jours à 6h00 UTC
  workflow_dispatch: # Permet de le lancer manuellement

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Générer le journal
        run: |
          goosepaper -c config.json -o journal.pdf

      - name: Envoyer sur Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F document=@"journal.pdf" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}"
